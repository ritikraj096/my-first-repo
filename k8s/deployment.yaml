apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clock-app
  template:
    metadata:
      labels:
        app: clock-app
    spec:
      containers:
      - name: clock-app
        image: ritikraj096/clock-app:latest
        ports:
        - containerPort: 80

