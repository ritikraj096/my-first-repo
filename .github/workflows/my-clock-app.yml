name: Deploy Clock App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # Test Kubernetes cluster connection
      - name: Test cluster connection
        run: kubectl get nodes

      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          clean: true

      # Step 2a: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t clock-app .
          echo "Build Done"

      # Step 2b: Push Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker tag clock-app ${{ secrets.DOCKERHUB_USERNAME }}/clock-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/clock-app:latest

      # Step 3: Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      # Step 4: Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # Step 5: Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/clock-app

      # Step 6: Verify service
      - name: Verify service
        run: |
          kubectl get pods
          kubectl get svc clock-app-service
